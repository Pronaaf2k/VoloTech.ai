<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>VoloTech.ai social preview</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body { background: #071a3b; color: #f4f4f1; font-family: Arial, Helvetica, sans-serif; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; padding: 66px 78px; background: linear-gradient(115deg, #081d43 0%, #081d43 64%, #0b2550 100%); }
    .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0 72%, rgba(255, 255, 255, .04) 72% 72.12%, transparent 72.12%); }
    .mark { position: absolute; right: 92px; top: -45px; width: 250px; height: 340px; background: #ff7614; clip-path: polygon(40% 0, 100% 0, 67% 40%, 100% 40%, 23% 100%, 38% 52%, 0 52%); filter: drop-shadow(0 18px 0 rgba(255, 118, 20, .12)); transform: rotate(10deg); }
    .rule { position: absolute; left: 78px; right: 78px; top: 54px; border-top: 1px solid rgba(255,255,255,.15); }
    .eyebrow { position: relative; display: inline-block; margin-top: 22px; color: #ff963e; font: 700 15px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { position: relative; max-width: 780px; margin: 90px 0 0; font-size: 76px; line-height: .98; letter-spacing: -.07em; font-weight: 700; }
    h1 span { color: #9eaabc; }
    .footer { position: absolute; left: 78px; right: 78px; bottom: 55px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.15); padding-top: 22px; color: #b5bfd0; font-size: 21px; }
    .footer strong { color: #f4f4f1; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card" aria-label="VoloTech.ai social preview">
    <div class="rule"></div><div class="mark" aria-hidden="true"></div>
    <div class="eyebrow">AI operations · MCP integrations</div>
    <h1>Your business.<br><span>In full flow.</span></h1>
    <div class="footer"><strong>VoloTech.ai</strong><span>AI agents for the tools you already use.</span></div>
  </main>
</body>
</html>
